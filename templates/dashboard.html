<!DOCTYPE html>
<html>
<head>
    <title>Server Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
    <style>
        /* Sidebar Styling */
        .sidebar {
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            background: #212529;
            padding-top: 0px;
            color: white;
            display: flex;
            flex-direction: column;
        }
        .ssh-info {
            background: #1a1e21;
            padding: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            text-align: left;
        }
        .ssh-info p {
            margin: 0;
            padding: 2px 0;
            color: #adb5bd;
        }
        .sidebar .section-title {
            padding: 10px 15px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #6c757d;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 10px;
        }
        .list-group {
            flex-grow: 1;
            padding: 10px;
        }
        .list-group-item {
            background: transparent;
            color: white;
            border: none;
            font-size: 1rem;
            padding: 10px 15px;
            text-align: left;
            transition: 0.3s;
        }
        .list-group-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .list-group-item.active {
            background: #0d6efd;
            color: white;
            font-weight: bold;
            border-radius: 0;
        }
        .content {
            margin-left: 270px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🛠 Server Manager</a>
            
            <div class="dropdown ms-auto">
                <button class="btn btn-dark dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    👤 {{ session['username'] }}
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                    <li class="dropdown-header text-muted">🔗 Connected to</li>
                    <li class="dropdown-item disabled">
                        <strong>{{ session['host'] }}</strong>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="#">🔄 Reconnect SSH</a></li>
                    <li><a class="dropdown-item text-danger" href="/logout">🚪 Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="ssh-info">
            <p>🖥 Host: {{ session['username'] }}</p>
            <p>🌐 IP: {{ session['host'] }}</p>
        </div>

        <div class="list-group">
            <div class="section-title">System</div>
            <a href="/dashboard" class="list-group-item list-group-item-action {% if request.path == '/dashboard' %}active{% endif %}">🏠 Dashboard</a>
            <a href="/monitoring" class="list-group-item list-group-item-action {% if request.path == '/monitoring' %}active{% endif %}">📈 Overview</a>
            <a href="/users" class="list-group-item list-group-item-action {% if request.path == '/users' %}active{% endif %}">👥 User Management</a>
            <div class="section-title">Tools</div>
            <a href="/terminal" class="list-group-item list-group-item-action {% if request.path == '/terminal' %}active{% endif %}">💻 Terminal</a>
        </div>
    </div>

    <!-- Content -->
    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
