<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Explorer</title>
    <script>
        function loadFiles(path = "/home") {
            fetch(`/list_files?path=${encodeURIComponent(path)}`)
            .then(res => res.json())
            .then(data => {
                let content = "<ul>";
                data.forEach(item => {
                    if (item.is_dir) {
                        content += `<li><a href="#" onclick="loadFiles('${path}/${item.name}')">📁 ${item.name}</a></li>`;
                    } else {
                        content += `<li>📄 ${item.name} <a href="/download?file=${path}/${item.name}">[Download]</a></li>`;
                    }
                });
                content += "</ul>";
                document.getElementById("fileList").innerHTML = content;
            });
        }
        window.onload = () => loadFiles();
    </script>
</head>
<body>
    <h2>File Explorer</h2>
    <div id="fileList">Loading...</div>
</body>
</html>
